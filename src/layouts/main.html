<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <meta name="description" content="{{meta_description}}">
    
    <!-- Open Graph / Social -->
    <meta property="og:title" content="{{title}}">
    <meta property="og:description" content="{{meta_description}}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.nexusb2b.com">
    <meta property="og:image" content="https://www.nexusb2b.com/assets/images/og-image.jpg">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="/assets/css/styles.css">
    
    <!-- Structured Data -->
    {{json_ld}}
</head>
<body>
    {{header}}
    <main id="main-content">
        {{content}}
    </main>
    {{footer}}
    
    <!-- JS -->
    <script src="/assets/js/main.js"></script>
</body>
</html>
