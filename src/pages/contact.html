<!-- TITLE: Contact Us | Nexus B2B -->
<!-- DESC: Get in touch with the Nexus B2B team. We're here to help you scale your business operations. -->
<!-- JSON_LD:
{
  "@context": "https://schema.org",
  "@type": "ContactPage"
}
-->
<section class="page-header">
    <div class="container">
        <h1>Get in Touch</h1>
        <p class="lead">Have questions? Our team is ready to help.</p>
    </div>
</section>

<section class="container section-padding">
    <div class="contact-grid">
        <div class="contact-info">
            <h2>Contact Information</h2>
            <p>Reach out to us directly or fill out the form, and we'll get back to you within 24 hours.</p>
            <address class="contact-details">
                <p><strong>Email:</strong> <a href="mailto:hello@nexusb2b.com">hello@nexusb2b.com</a></p>
                <p><strong>Phone:</strong> <a href="tel:+18005550199">+1 (800) 555-0199</a></p>
                <p><strong>Office:</strong><br>
                   100 Innovation Way<br>
                   Suite 500<br>
                   San Francisco, CA 94105
                </p>
            </address>
        </div>
        <div class="contact-form-wrapper glass-panel">
            <form action="#" method="POST" class="contact-form" id="contactForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" required aria-required="true" placeholder="Jane Doe">
                </div>
                <div class="form-group">
                    <label for="email">Work Email</label>
                    <input type="email" id="email" name="email" required aria-required="true" placeholder="jane@company.com">
                </div>
                <div class="form-group">
                    <label for="company">Company Name</label>
                    <input type="text" id="company" name="company" required aria-required="true" placeholder="Acme Corp">
                </div>
                <div class="form-group">
                    <label for="message">How can we help you?</label>
                    <textarea id="message" name="message" rows="5" required aria-required="true" placeholder="Tell us about your needs..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary full-width">Send Message</button>
            </form>
        </div>
    </div>
</section>
